<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#342232"/>
      <stop offset="70%" stop-color="#1c131d"/>
      <stop offset="100%" stop-color="#0e090f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedd7"/>
      <stop offset="50%" stop-color="#d4af7a"/>
      <stop offset="100%" stop-color="#9a7138"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#d4af7a" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer circle background -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  
  <!-- Double gold border -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#gold)" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="rgba(212, 175, 122, 0.45)" stroke-width="0.8" stroke-dasharray="2 2"/>
  
  <!-- Tiny decorative star on top -->
  <path d="M32 9.5 L32.8 11.5 L34.8 12.3 L32.8 13.1 L32 15.1 L31.2 13.1 L29.2 12.3 L31.2 11.5 Z" fill="url(#gold)"/>
  
  <!-- KB Monogram Text -->
  <text x="32" y="40" 
        font-family="'Cinzel', 'Cormorant Garamond', Georgia, serif" 
        font-size="21" 
        font-weight="700" 
        letter-spacing="1.2" 
        fill="url(#gold)" 
        text-anchor="middle"
        filter="url(#glow)">KB</text>
</svg>
